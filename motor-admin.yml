- id: 5
  name: LWL Count
  sql_body: |-
    SELECT
        'LWL' AS category,
        (
            SELECT COUNT(*)
            FROM Participant as p JOIN Zipcode as z on z.participantId=p.id
            WHERE (
                z.code LIKE '32%' OR
                z.code LIKE '33%' OR
                z.code LIKE '44%' OR
                z.code LIKE '45%' OR
                z.code LIKE '46%' OR
                z.code LIKE '48%' OR
                z.code LIKE '57%' OR
                z.code LIKE '58%' OR
                z.code LIKE '59%')
        ) as lwl_count
    UNION ALL
    SELECT
        'Other' AS category,
        (
            SELECT SUM(p.participantCount) FROM Participant as p
        ) - (
            SELECT COUNT(*)
            FROM Participant as p JOIN Zipcode as z on z.participantId=p.id
            WHERE (
                z.code LIKE '32%' OR
                z.code LIKE '33%' OR
                z.code LIKE '44%' OR
                z.code LIKE '45%' OR
                z.code LIKE '46%' OR
                z.code LIKE '48%' OR
                z.code LIKE '57%' OR
                z.code LIKE '58%' OR
                z.code LIKE '59%')
        ) as other_count
  description:
  preferences:
    query_type: sql
    database: Default
    visualization: pie_chart
    visualization_options:
      label_format: decimal
      label_format_options: {}
    variables: []
  tags: []
  updated_at: 2026-05-01 17:27:02.573181000 +00:00
