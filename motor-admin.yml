queries:
- id: 3
  name: Flinta Quota
  sql_body: "SELECT \n    'FLINTA' AS category, \n    SUM(flintaParticipantsCount)
    AS total\nFROM Participant\nUNION ALL\nSELECT \n    'Other' AS category, \n    SUM(participantCount
    - flintaParticipantsCount) AS total\nFROM Participant;"
  description:
  preferences:
    query_type: sql
    database: Default
    visualization: pie_chart
    visualization_options:
