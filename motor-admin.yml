    - name: participant
      preferences:
          actions:
              - preferences:
                    show_on_table: true
                name: edit
          custom_sql: "SELECT `p`.*,\n    p.flintaParticipantsCount / p.participantCount
              * 100 AS flinta_quota,\n    (\n        SELECT COUNT(*) \n        FROM `Zipcode`
              z \n        WHERE z.participantId = p.id \n        AND (z.code LIKE '32%' OR\n
              \            z.code LIKE '33%' OR\n             z.code LIKE '44%' OR\n             z.code
              LIKE '45%' OR\n             z.code LIKE '46%' OR\n             z.code LIKE '48%'
              OR\n             z.code LIKE '57%' OR\n             z.code LIKE '58%' OR\n             z.code
              LIKE '59%'\n         )\n    ) / p.participantCount * 100 AS lwl_quota,\n    (\n
              \       SELECT COUNT(*) \n        FROM `Zipcode` z \n        WHERE z.participantId
              = p.id \n        AND z.code in ('48143', '48145', '48147', '48149', '48151',
              '48153', '48155', '48157', '48159', '48161', '48163', '48165', '48167')\n    )
              / p.participantCount * 100 AS ms_quota\nFROM `Participant` AS p;"
          columns:
