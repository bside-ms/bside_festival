services:
    app:
        build:
            context: .
            target: development
        command: npm run dev
        restart: on-failure
        init: true
        depends_on:
            - db
            - mailcatcher
        environment:
            RUNNING_IN_DOCKER: '1'
            SHADOW_DATABASE_URL: 'mysql://festival:1rDS3yHAdVaMX5Ey@db:3306/test_festival_shadow'
            WATCHPACK_POLLING: 'true'
            CHOKIDAR_USEPOLLING: 'true'
        env_file:
            - .env
        ports:
            - '3000:3000'
        volumes:
            - .:/app
            - app_node_modules:/app/node_modules
            - app_next:/app/.next

    mailcatcher:
        image: docker.io/schickling/mailcatcher
        ports:
            - 1081:1080
            - 1026:1025

    db:
        image: mariadb:10.5.8
        environment:
            MYSQL_DATABASE: 'test_festival'
            MYSQL_USER: 'festival'
            MYSQL_PASSWORD: '1rDS3yHAdVaMX5Ey'
            MYSQL_ROOT_PASSWORD: 'puAx0aWi8E6CTw3V'
        ports:
            - '3308:3306'
        expose:
            - '3306'
        volumes:
            - db_test_festival:/var/lib/mysql

volumes:
    app_node_modules:
    app_next:
    db_test_festival:
