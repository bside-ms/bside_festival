name: Docker Image CI
on:
    push:
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
            - name: Install dependencies
              id: install
              run: npm ci
            - name: Generate Prisma Client
              id: prisma_client
              if: ${{ always() && steps.install.outcome == 'success' }}
              env:
                  # Prisma 7 loads prisma.config.ts during generation and requires a valid URL string, but does not connect.
                  DATABASE_URL: mysql://prisma-generate-only:not-used@localhost:3306/prisma_generate_only
              run: npm run prisma:client:generate
            - name: Type check
              if: ${{ always() && steps.install.outcome == 'success' && steps.prisma_client.outcome == 'success' }}
              run: npm run tsc
            - name: Lint
              if: ${{ always() && steps.install.outcome == 'success' && steps.prisma_client.outcome == 'success' }}
              run: npm run lint
            - name: Test
              if: ${{ always() && steps.install.outcome == 'success' && steps.prisma_client.outcome == 'success' }}
              run: npm run test
            - name: Find unused code
              if: ${{ always() && steps.install.outcome == 'success' && steps.prisma_client.outcome == 'success' }}
              run: npm run find-unused
            - name: Audit dependencies
              if: ${{ always() && steps.install.outcome == 'success' && steps.prisma_client.outcome == 'success' }}
              run: npm run audit
            - name: Code style check
              if: ${{ always() && steps.install.outcome == 'success' && steps.prisma_client.outcome == 'success' }}
              run: npm run prettier

    build:
        runs-on: ubuntu-latest
        needs: check
        if: ${{ github.ref == 'refs/heads/main' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.DOCKER_REPOSITORY }}/${{ secrets.DOCKER_REPO_NAME }}
                  tags: |
                      type=sha,enable=true,priority=100,prefix=,suffix=,format=short
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ${{ secrets.DOCKER_REPOSITORY }}
                  username: ${{ secrets.GITLAB_USERNAME }}
                  password: ${{ secrets.GITLAB_PASSWORD }}
            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  provenance: false
                  sbom: false
                  tags: |
                      ${{ steps.meta.outputs.tags }}
                      ${{ secrets.DOCKER_REPOSITORY }}/${{ secrets.DOCKER_REPO_NAME }}:latest
                  build-args: GIT_SHA=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true
